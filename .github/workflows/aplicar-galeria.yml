name: Aplicar galeria

on:
  push:
    branches:
      - feature/carrossel-fotos

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: feature/carrossel-fotos

      - name: Atualizar carrossel
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          fotos = [f"assets/gallery/foto-{i:02d}.webp" for i in range(1, 14)]
          lista = "var FOTOS = [\n" + "\n".join(f"    '{foto}'," for foto in fotos) + "\n  ];"

          if 'var FOTOS = [];' not in text:
              raise SystemExit('Lista FOTOS vazia não encontrada; nenhuma alteração feita.')
          text = text.replace('var FOTOS = [];', lista, 1)

          text = text.replace(
              'FOTOS.forEach(function(id, i){',
              'FOTOS.forEach(function(src, i){',
              1
          )

          origem = "    img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600';"
          destino = "    img.src = src;\n    img.loading = i === 0 ? 'eager' : 'lazy';\n    img.decoding = 'async';"
          if origem not in text:
              raise SystemExit('Linha de carregamento do Google Drive não encontrada.')
          text = text.replace(origem, destino, 1)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/aplicar-galeria.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit da alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona galeria local de fotos"
          git push origin feature/carrossel-fotos
